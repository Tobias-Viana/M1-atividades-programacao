<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tobias Viana Araújo</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style> body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            scale : {
                mode: Phaser.Scale.RESIZE, //O jogo se redimensiona automaticamente
                autoCenter: Phaser.Scale.CENTER_BOTH, //Centraliza o jogo na tela
            },
            physics: { //Adiciona física ao jogo
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };
        //Variáveis para a inialização do jogo
        const game = new Phaser.Game(config);
        var alien, teclado, fogo, moeda, placar;
        var plataformas = []; //Variável para adicionar as plataformas com a estrutura de lista
        var pontuacao = 0;

        function preload() {
            this.load.image('bg', 'assets/bg.png'); //Carregamento do background
            this.load.image('et', 'assets/alien.png'); //Carregamneto da imagem do alien
            this.load.image('turbo', 'assets/turbo.png'); //Carregamento do fogo
            this.load.image('plataforma', 'assets/tijolos.png'); //Carregamento da plataforma
            this.load.image('moeda', 'assets/coin.png'); //Carregamento da moeda
        }
        function create() {
            var scene = this
            bg = this.add.image(0, 0, 'bg').setOrigin(0, 0); //Cria a imagem do background do jogo
            bg.setDisplaySize(this.scale.width, this.scale.height);

            fogo = this.add.sprite(0, 0, 'turbo'); //Cria o fogo da espaço nave
            fogo.setVisible(false);

            alien = this.physics.add.sprite(this.scale.width / 2, this.scale.height / 5, 'et'); //Cria a imagem do alien            
            alien.setCollideWorldBounds(true); //Adiciona limites físicos ao alien para não sair da tela
            teclado = this.input.keyboard.createCursorKeys(); //Comando para acessar as teclas do teclado

             // Criando múltiplas plataformas dinamicamente com estrutura de listas
             let posicoesPlataformas = [
                { x: this.scale.width / 2, y: this.scale.height / 2 },
                { x: this.scale.width / 4, y: this.scale.height / 3 },
                { x: this.scale.width / 1.2, y: this.scale.height / 4 }
            ];
            posicoesPlataformas.forEach(pos => { //Para cada item da lista tem as seguintes condições
                let plataforma = this.physics.add.staticImage(pos.x, pos.y, 'plataforma');
                this.physics.add.collider(alien, plataforma);
                plataformas.push(plataforma);
            });
            moeda = this.physics.add.sprite(this.scale.width / 2, 0, 'moeda'); //Adicionando moeda
            moeda.setCollideWorldBounds(true);
            moeda.setBounce(0.5);
            //Colisão da moeda com as plataformas
            plataformas.forEach(plataforma => {
                this.physics.add.collider(moeda, plataforma);
            });
            placar = this.add.text(50, 50, 'Coins:' + pontuacao, {fontSize:'45px', fill:'#495613'}); // Adicionando placar 

            this.physics.add.overlap(alien, moeda, function() { //Coletando as moedas
                moeda.setVisible(false); //Moeda fica "invisivel"
                var posicaoMoeda_X = Phaser.Math.RND.between(50, scene.scale.width - 50); //Moeda aparece aleatoriamente na tela
                moeda.setPosition(posicaoMoeda_X, 50);
                pontuacao +=1; //Soma a pontuação
                placar.setText('Coins:' + pontuacao); //Atualiza o número do placar
                moeda.setVisible(true); //"Nova moeda" aparece na tela
            });
            //Ajusta as imagens de acordo com o tamanho da tela
            this.scale.on('resize', (gameSize) => {
                bg.setDisplaySize(gameSize.width, gameSize.height);
        });
    }
        function update() {
            //Movimentoto esquerda
            if (teclado.left.isDown) {
                alien.setVelocityX(-400); }
            //Movimento direita
            else if (teclado.right.isDown) {
                alien.setVelocityX(400); }
            //Sem moviemnto horizontal
            else {
                alien.setVelocityX(0);
            }
            //Movimento para cima
            if (teclado.up.isDown) {
                alien.setVelocityY(-200);
                ativarTurbo(); 
            }
            //Movimento para baixo
            else {
                semTurbo(); //Gravidade adicionada no jogo no eixo y
            } 
        }
        function ativarTurbo() {
            fogo.setVisible(true);
            fogo.setPosition(alien.x, alien.y + alien.height / 2); //Atualiza a animação do turbo em relação ao alien
        }
        function semTurbo() {
            fogo.setVisible(false);
    }
    </script>
</body>
<script>
    var resposta = "Foi retirado a função, debug: true, para ficar um visual melhor do jogo, mas a função foi usada durante o desenvolvimento do código."
    console.log(resposta)
</script>
</html>
