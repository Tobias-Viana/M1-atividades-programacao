<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <title>Tobias Viana Araújo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

<script>
var config = {
    type: Phaser.AUTO,
    scale: {
        //Comando para a imagem se regular ao tamanho da tela
        mode: Phaser.Scale.RESIZE,
        //Centraliza da imagem ao centro da tela
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var game = new Phaser.Game(config);
var selva, bird;

function preload() {
    //Carregamento da imagem de fundo da floresta
    this.load.image('selva', 'assets/floresta.png');
    //Carregamento da imagem do pássaro
    this.load.spritesheet('bird', 'assets/bird.png', {frameWidth: 75, frameHeight: 75 });
}

function create() {
    var scene = this;
    //Origem da imagem na tela
    selva = this.add.image(0, 0, 'selva').setOrigin(0, 0);
    selva.setDisplaySize(this.scale.width, this.scale.height);
    //Adiciona o sprite do pássaro na tela na respectiva escala
    bird = this.add.sprite(100, 300, 'bird').setScale(1.3);
    
    this.anims.create({
        key: 'fly',
        frames: this.anims.generateFrameNumbers('bird', { start: 0, end: 7 }),
        frameRate: 15,
        repeat: -1
    });

    bird.anims.play('fly', true);

    // Evento para redimensionar a imagem quando a tela mudar de tamanho
    this.scale.on('resize', function (gameSize) {
        var width = gameSize.width;
        var height = gameSize.height;
        selva.setDisplaySize(width, height);
    });
}
function update() {    
    for (let i = 0; i < 5; i++) {
        if (bird.ida) {
            //Velocidade do pássaro para direita
            bird.x += 2;
            if (bird.x >= this.scale.width - 50) { 
                bird.setFlip(true, false);
                bird.ida = false;
            }
        } else {
            //Velocidade do pássaro para esquerda
            bird.x -= 2;
            if (bird.x <= 50) { 
                bird.setFlip(false, false);
                bird.ida = true;
            }
        }
    }
    for (let i = 0; i < 5; i++) { 
        if (bird.subindo) {
            //Velocidade do pássaro para cima
            bird.y -= 1; 
            if (bird.y <= 50) {
                bird.subindo = false;
            }
        } else {
            //Velocidade do pássaro para baixo
            bird.y += 1; 
            if (bird.y >= this.scale.height - 50) { 
                bird.subindo = true;
            }
        }
    }
}
</script>   
</body>
</html>
